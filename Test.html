<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Alex Mercer</title>
<style>
/* =====================================================
   BASE & RESET
===================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
  font-family:'Courier New',Courier,monospace;
}

/* =====================================================
   CRT WRAPPER — the black body around the screen
===================================================== */
.crt-body{
  position:relative;
  width:100vw;height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

/* =====================================================
   CRT SCREEN — the actual monitor glass
   Barrel distortion via perspective + border-radius
===================================================== */
.crt-screen{
  position:relative;
  width:100%;
  height:100%;
  background:#030d14;
  overflow:hidden;

  /* CRT curved edges — horizontal barrel */
  border-radius: 2% / 4%;

  /* Phosphor glow bleed at edges */
  box-shadow:
    inset 0 0 80px rgba(0,0,0,0.9),
    inset 0 0 30px rgba(0,200,140,0.04),
    0 0 0 4px #000;
}

/* =====================================================
   SCANLINES — the most critical CRT effect
   Horizontal lines across the entire screen
===================================================== */
.crt-screen::before{
  content:'';
  position:absolute;inset:0;
  z-index:100;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 1px,
    rgba(0,0,0,0.35) 1px,
    rgba(0,0,0,0.35) 2px
  );
}

/* =====================================================
   VIGNETTE — dark corners for screen curve illusion
===================================================== */
.crt-screen::after{
  content:'';
  position:absolute;inset:0;
  z-index:101;
  pointer-events:none;
  background:
    radial-gradient(ellipse 100% 100% at 50% 50%,
      transparent 60%,
      rgba(0,0,0,0.85) 100%
    );
}

/* =====================================================
   EDGE BLEED — vertical cyan artifact lines
   Mimics the screenshot's left/right glow strips
===================================================== */
.edge-left,.edge-right{
  position:absolute;top:0;bottom:0;
  width:2px;
  z-index:99;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,255,160,0.4) 20%,
    rgba(0,255,160,0.5) 50%,
    rgba(0,255,160,0.4) 80%,
    transparent 100%
  );
  filter:blur(1px);
}
.edge-left {left:0;}
.edge-right{right:0;}

/* =====================================================
   SCREEN CONTENT — sits above all overlays
===================================================== */
.screen-content{
  position:relative;
  z-index:10;
  width:100%;height:100%;
  display:flex;
  flex-direction:column;
  color:#00ff9f;
}

/* =====================================================
   SITE TITLE — top left, outlined/hollow pixel look
===================================================== */
.site-title{
  padding:10px 16px 2px;
  font-size:clamp(20px,3.5vw,42px);
  font-weight:bold;
  letter-spacing:0.06em;
  line-height:1;

  /* Hollow outlined look matching the screenshot */
  color:transparent;
  -webkit-text-stroke:1.5px #00ff9f;
  text-shadow:
    0 0 8px  rgba(0,255,160,0.8),
    0 0 20px rgba(0,255,160,0.4),
    0 0 40px rgba(0,255,160,0.15);
}

/* Current path shown below title */
.site-path{
  padding:0 18px 6px;
  font-size:clamp(10px,1.2vw,13px);
  color:#00996a;
  letter-spacing:0.04em;
}

/* =====================================================
   TWO-PANEL AREA
===================================================== */
.panels{
  flex:1;
  display:flex;
  min-height:0;
}

/* LEFT PANEL — file list */
.panel-left{
  width:clamp(160px,28%,320px);
  flex-shrink:0;
  padding:4px 0;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
}
.panel-left::-webkit-scrollbar{display:none}

/* DIVIDER */
.panel-divider{
  width:1px;
  flex-shrink:0;
  background:linear-gradient(
    to bottom,
    transparent,
    #006644 15%,
    #00ff9f 50%,
    #006644 85%,
    transparent
  );
  opacity:0.6;
}

/* RIGHT PANEL — file content */
.panel-right{
  flex:1;
  min-width:0;
  padding:16px 24px 16px 28px;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  scrollbar-color:#004433 transparent;
}
.panel-right::-webkit-scrollbar{width:3px}
.panel-right::-webkit-scrollbar-thumb{background:#004433}

/* =====================================================
   FILE LIST ITEMS
===================================================== */
.file-list{list-style:none}

.file-item{
  display:block;
  padding:2px 14px;
  font-size:clamp(10px,1.3vw,14px);
  color:#00cc88;
  letter-spacing:0.03em;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.85;
  user-select:none;
}
.file-item:hover{
  color:#00ff9f;
  background:rgba(0,255,160,0.08);
}

/* Selected item — solid bright bar like in screenshot */
.file-item.selected{
  background:#00ff9f;
  color:#030d14;
  font-weight:bold;
  /* Extend the bar full width */
  padding-left:14px;
}

/* Directories slightly different color */
.file-item.is-dir{color:#00ff9f}
.file-item.is-dir:not(.selected){color:#00cc88}

/* =====================================================
   CONTENT AREA — right panel text
===================================================== */
.content-area{
  font-size:clamp(10px,1.25vw,14px);
  line-height:1.75;
  color:#00cc88;
}

/* H1 — big outlined title like "Tutorial" in screenshot */
.c-h1{
  font-size:clamp(18px,2.8vw,36px);
  font-weight:bold;
  letter-spacing:0.06em;
  margin-bottom:14px;
  line-height:1.15;

  color:transparent;
  -webkit-text-stroke:1.5px #00ff9f;
  text-shadow:
    0 0 10px rgba(0,255,160,0.7),
    0 0 25px rgba(0,255,160,0.3);
}

/* H2 — section headers like "NAVIGATION", "FILE VIEWING" */
.c-h2{
  font-size:clamp(14px,2vw,26px);
  font-weight:bold;
  letter-spacing:0.1em;
  margin:18px 0 6px;
  line-height:1.2;

  color:transparent;
  -webkit-text-stroke:1px #00ff9f;
  text-shadow:
    0 0 8px rgba(0,255,160,0.6),
    0 0 18px rgba(0,255,160,0.25);
}

/* H3 */
.c-h3{
  font-size:clamp(11px,1.4vw,16px);
  font-weight:bold;
  color:#00ff9f;
  letter-spacing:0.08em;
  margin:14px 0 4px;
  text-shadow:0 0 6px rgba(0,255,160,0.5);
}

/* Paragraph */
.c-p{
  color:#00aa77;
  margin:3px 0;
}

/* List item — dash prefix like in screenshot */
.c-li{
  color:#00aa77;
  padding-left:0;
  margin:2px 0;
}
.c-li::before{
  content:'- ';
  color:#006644;
}

/* Key:value pair */
.c-kv{display:flex;gap:0;margin:2px 0}
.c-key{
  color:#00ff9f;
  min-width:120px;
  flex-shrink:0;
  text-shadow:0 0 4px rgba(0,255,160,0.4);
}
.c-val{color:#00aa77}

/* Divider */
.c-hr{
  border:none;
  border-top:1px solid #004433;
  margin:12px 0;
}

/* Pre / code block */
.c-pre{
  color:#006644;
  font-size:0.88em;
  margin:8px 0;
  padding:8px 10px;
  border-left:2px solid #004433;
  white-space:pre-wrap;
}

/* Skill bar */
.c-skill{display:flex;align-items:center;gap:10px;margin:3px 0}
.c-skill-name{min-width:140px;color:#00aa77;flex-shrink:0;font-size:0.9em}
.c-skill-bar{flex:1;height:7px;background:#001a0d}
.c-skill-fill{height:100%;background:#00ff9f;box-shadow:0 0 6px rgba(0,255,160,0.5)}

/* Tags */
.c-tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.c-tag{
  font-size:0.75em;
  color:#030d14;
  background:#00996a;
  padding:1px 6px;
}

/* Blinking cursor */
.cursor{
  display:inline-block;
  width:8px;height:0.9em;
  background:#00ff9f;
  vertical-align:bottom;
  margin-left:2px;
  box-shadow:0 0 8px rgba(0,255,160,0.8);
  animation:blink 1s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* =====================================================
   STATUS BAR — bottom
===================================================== */
.status-bar{
  flex-shrink:0;
  padding:3px 14px;
  border-top:1px solid #003322;
  display:flex;
  justify-content:space-between;
  font-size:clamp(9px,1vw,12px);
  color:#006644;
  letter-spacing:0.06em;
  background:#020b10;
}
.status-bar kbd{
  border:1px solid #006644;
  color:#00996a;
  padding:0 4px;
  font-family:inherit;
}

/* =====================================================
   CONTENT REVEAL ANIMATION
===================================================== */
@keyframes fade-in{
  from{opacity:0;transform:translateX(6px)}
  to  {opacity:1;transform:none}
}
.content-area > *{animation:fade-in 0.15s ease both}

/* =====================================================
   RESPONSIVE
===================================================== */
@media(max-width:540px){
  .panel-left{width:38%}
  .panel-right{padding:10px 12px}
  .status-bar span:nth-child(2){display:none}
}
</style>
</head>

/* =====================================================
   STATE
===================================================== */
const State = {
  path:[],        // path segments descended into
  selIdx:0,       // highlighted index in current dir
  entries:[],     // [{name,node}] for current dir
};

/* =====================================================
   DOM
===================================================== */
const elList    = document.getElementById('fileList');
const elContent = document.getElementById('contentArea');
const elPath    = document.getElementById('sitePath');
const elStatusL = document.getElementById('statusLeft');
const elStatusR = document.getElementById('statusRight');

/* =====================================================
   AUDIO
===================================================== */
let actx=null;
function sfx(freq=500,dur=30,vol=0.04){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    o.type='square';o.frequency.value=freq;
    g.gain.value=vol;
    o.start();o.stop(actx.currentTime+dur/1000);
  }catch(_){}
}

/* =====================================================
   HELPERS
===================================================== */
function currentDir(){
  let node=FS;
  for(const seg of State.path){
    node=node.children[seg+'/']||node.children[seg];
  }
  return node;
}

function buildEntries(dirNode){
  return Object.entries(dirNode.children).map(([name,node])=>({name,node}));
}

function pathStr(){
  return '/'+State.path.join('/')+(State.path.length?'/':'');
}

/* =====================================================
   RENDER LEFT PANEL
===================================================== */
function renderList(){
  const dir=currentDir();
  State.entries=buildEntries(dir);
  State.selIdx=Math.max(0,Math.min(State.selIdx,State.entries.length-1));

  elList.innerHTML='';
  State.entries.forEach(({name,node},i)=>{
    const li=document.createElement('li');
    li.className='file-item'+(node.type==='dir'?' is-dir':'')+(i===State.selIdx?' selected':'');
    li.setAttribute('role','option');
    li.textContent=name;
    li.addEventListener('mouseenter',()=>{State.selIdx=i;renderList();renderRight();});
    li.addEventListener('click',()=>{State.selIdx=i;open();});
    elList.appendChild(li);
  });

  const sel=elList.querySelector('.selected');
  if(sel)sel.scrollIntoView({block:'nearest'});

  elPath.textContent=pathStr();
  elStatusL.textContent=pathStr();
  elStatusR.textContent=State.entries.length+' ITEMS';
}

/* =====================================================
   RENDER RIGHT PANEL
===================================================== */
function renderRight(){
  const entry=State.entries[State.selIdx];
  elContent.innerHTML='';
  if(!entry)return;

  if(entry.node.type==='dir'){
    appendNode({t:'h1',v:entry.name});
    appendNode({t:'hr'});
    Object.entries(entry.node.children).forEach(([n,nd])=>{
      const d=document.createElement('div');
      d.style.cssText='color:'+(nd.type==='dir'?'#00ff9f':'#00aa77')+';padding:1px 0;font-size:0.95em';
      d.textContent=(nd.type==='dir'?'  ':'  ')+n;
      elContent.appendChild(d);
    });
    const hint=document.createElement('p');
    hint.style.cssText='color:#006644;margin-top:10px;font-size:0.9em';
    hint.textContent='Press → or ENTER to enter directory.';
    elContent.appendChild(hint);
  } else {
    entry.node.content.forEach(n=>appendNode(n));
  }

  // Blinking cursor at end
  const cur=document.createElement('span');
  cur.className='cursor';
  elContent.appendChild(cur);
}

function appendNode(n){
  let el;
  if(n.t==='h1'){
    el=document.createElement('div');el.className='c-h1';el.textContent=n.v;
  }else if(n.t==='h2'){
    el=document.createElement('div');el.className='c-h2';el.textContent=n.v;
  }else if(n.t==='h3'){
    el=document.createElement('div');el.className='c-h3';el.textContent=n.v;
  }else if(n.t==='p'){
    el=document.createElement('p');el.className='c-p';el.textContent=n.v;
  }else if(n.t==='li'){
    el=document.createElement('div');el.className='c-li';el.textContent=n.v;
  }else if(n.t==='kv'){
    el=document.createElement('div');el.className='c-kv';
    const k=document.createElement('span');k.className='c-key';k.textContent=n.k;
    const v=document.createElement('span');v.className='c-val';v.textContent=n.v;
    el.appendChild(k);el.appendChild(v);
  }else if(n.t==='hr'){
    el=document.createElement('div');el.className='c-hr';
  }else if(n.t==='pre'){
    el=document.createElement('pre');el.className='c-pre';el.textContent=n.v;
  }else if(n.t==='skill'){
    el=document.createElement('div');el.className='c-skill';
    const nm=document.createElement('span');nm.className='c-skill-name';nm.textContent=n.name;
    const bar=document.createElement('div');bar.className='c-skill-bar';
    const fill=document.createElement('div');fill.className='c-skill-fill';fill.style.width=n.pct+'%';
    bar.appendChild(fill);el.appendChild(nm);el.appendChild(bar);
  }else if(n.t==='tags'){
    el=document.createElement('div');el.className='c-tags';
    n.items.forEach(tag=>{
      const s=document.createElement('span');s.className='c-tag';s.textContent=tag;el.appendChild(s);
    });
  }else return;
  elContent.appendChild(el);
}

/* =====================================================
   NAVIGATION ACTIONS
===================================================== */
function moveUp(){
  if(!State.entries.length)return;
  State.selIdx=(State.selIdx-1+State.entries.length)%State.entries.length;
  sfx(600,25,0.04);
  renderList();renderRight();
}

function moveDown(){
  if(!State.entries.length)return;
  State.selIdx=(State.selIdx+1)%State.entries.length;
  sfx(600,25,0.04);
  renderList();renderRight();
}

function open(){
  const e=State.entries[State.selIdx];if(!e)return;
  if(e.node.type==='dir'){
    State.path.push(e.name.replace(/\/$/,''));
    State.selIdx=0;
    sfx(750,40,0.05);
    renderList();renderRight();
  }else{
    sfx(900,50,0.06);
  }
}

function back(){
  if(State.path.length===0){sfx(220,40,0.04);return;}
  State.path.pop();
  State.selIdx=0;
  sfx(380,35,0.04);
  renderList();renderRight();
}

/* =====================================================
   KEYBOARD
===================================================== */
document.addEventListener('keydown',e=>{
  switch(e.key){
    case'ArrowUp':   e.preventDefault();moveUp();break;
    case'ArrowDown': e.preventDefault();moveDown();break;
    case'ArrowRight':case'Enter':e.preventDefault();open();break;
    case'ArrowLeft': case'Backspace':e.preventDefault();back();break;
  }
});

/* =====================================================
   INIT
===================================================== */
renderList();
renderRight();
</script>
</body>
</html>
